# Default values for edge-site.

globals:
  # Environment Secrets
  # List installed Secrets in the foxglove namespace that will be loaded as
  # environment variables. A single Secret can contain multiple key-value pairs.
  secrets:
  ## E.g.:
  ## - arbitrary-secret
  ## - another-secret

  # The api endpoint the deployment will use as the control plane
  foxgloveApiUrl: https://api.foxglove.dev

  aws:
    ## For example: us-east-1
    region: ""

  # This section configures where the deployment will upload files you wish to import.
  upload:
    # Upload to either a Foxglove-hosted or self-managed primary site.
    # Values: "self-managed", "hosted"
    primarySiteMode: self-managed
    # The cloud provider where the self-managed primary site inbox bucket lives. Ignored if
    # `primarySiteMode` is set to `hosted`.
    # Values: aws, azure, google_cloud
    provider:
    # The self-managed primary site inbox bucket name. Ignored if `primarySiteMode` is set to
    # `hosted`.
    bucketName:

# Configuration for recording storage, defaults to the persistent volume configured by
# `edgeController.storageClaim`
recordingStorage:
  provider: "local"
  # If storing recordings on an S3-compatible service, set `provider` to "s3_compatible"
  # The service URL eg. https://my-minio-service.mycompany.com
  s3CompatibleServiceUrl: ""
  # If storing recordings on an S3-compatible service, set the bucket name where the recordings are
  # stored.
  bucketName: ""
  # If your service is configured with a region (eg. us-east-1), set it here.
  s3CompatibleServiceRegion: ""

edgeController:
  image: "us-central1-docker.pkg.dev/foxglove-images/images/edge-controller"
  storageClaim: edge-controller-storage-claim
  indexClaim: edge-controller-index-claim
  metrics:
    namespace: ""
    subsystem: ""
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "256Mi"
      cpu: "250m"
  # Readiness probe for the edge controller container. The controller opens its API port (9099,
  # named `api`) only after it has reached the Foxglove API and initialized the site, so the pod
  # stays NotReady, and out of the `edge-controller` Service, until it can serve requests.
  # Fields merge with your values; set to `null` to remove the probe.
  readinessProbe:
    httpGet:
      path: /v1/liveness
      port: api
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 6
  # Liveness and startup probes are off by default. While the Foxglove API is unreachable, the
  # controller stays up and retries site initialization with its API port closed, so any probe of
  # that port fails and a liveness probe would restart a pod that is only waiting on Foxglove.
  # The controller exits on fatal errors, so Kubernetes restarts it without a liveness probe.
  # If you set `livenessProbe`, also set a `startupProbe` whose `periodSeconds` x
  # `failureThreshold` covers the longest Foxglove API outage the pod should wait through when it
  # starts. Kubernetes runs neither the readiness nor the liveness probe until the startup probe
  # succeeds, so a long `periodSeconds` delays readiness. Both take a standard Kubernetes probe
  # spec, for example:
  #
  # startupProbe:
  #   httpGet:
  #     path: /v1/liveness
  #     port: api
  #   periodSeconds: 10
  #   failureThreshold: 8640  # 24 hours
  # livenessProbe:
  #   httpGet:
  #     path: /v1/liveness
  #     port: api
  #   periodSeconds: 30
  #   timeoutSeconds: 10
  #   failureThreshold: 10
  livenessProbe: {}
  startupProbe: {}
  podLabels: {}
  podAnnotations: {}
  serviceLabels: {}
  env: []
  initContainers: []
  extraVolumes: []
  extraVolumeMounts: []
